# ============================================
#  哨兵导航轨迹优化配置文件
# ============================================
# 修改此文件后重新运行程序即可生效，无需重新编译

# ============================================
# 约束参数（硬约束，不可超过）
# ============================================
constraints:
  max_velocity: 1.0          # 最大速度 (m/s) - 不可超过此值
  max_acceleration: 1.0      # 最大加速度 (m/s²) - 不可超过此值
  max_segment_time: 10.0     # 每段最大时间 (s)

# ============================================
# 性能调优参数（核心！调这些来优化性能）
# ============================================
performance:
  # 时间分配安全系数（越小越激进）
  # 范围: 1.0 - 1.5
  # 1.0 = 极限性能（可能违反约束）
  # 1.05 = 高性能（推荐）
  # 1.2 = 保守
  # 1.5 = 非常保守
  time_safety_factor: 1.02   # 当前：激进模式
  
  # 速度利用率（越高越快）
  # 范围: 0.5 - 1.0
  # 1.0 = 100%利用（极限）
  # 0.9 = 90%利用（推荐）
  # 0.7 = 70%利用（保守）
  velocity_utilization: 0.95  # 当前：95%利用
  
  # 段间速度保持率（越高越连续）
  # 范围: 0.5 - 0.95
  # 0.95 = 高速连续
  # 0.85 = 中等连续（推荐）
  # 0.6 = 保守
  waypoint_velocity_ratio: 0.90  # 当前：90%
  
  # 最小段时间 (s)（越小允许更快的短段）
  # 范围: 0.3 - 2.0
  min_segment_time: 0.3      # 当前：0.3秒
  
  # 时间缩放优化开关
  enable_time_refinement: true  # 是否启用时间缩放优化
  
# ============================================
# 曲率约束（可选，用于精细控制转弯）
# ============================================
curvature:
  enable_limit: false        # 是否启用曲率约束
  max_curvature: 2.0         # 最大曲率 (1/m)
  velocity_curvature_map: true  # 是否使用速度-曲率映射 v ≤ sqrt(a_max/κ)
  
# ============================================
# 边界条件
# ============================================
boundary_conditions:
  initial:
    velocity: [0.0, 0.0]     # 初始速度 [vx, vy] (m/s)
    acceleration: [0.0, 0.0] # 初始加速度 [ax, ay] (m/s²)
  final:
    velocity: [0.0, 0.0]     # 终止速度 [vx, vy] (m/s)
    acceleration: [0.0, 0.0] # 终止加速度 [ax, ay] (m/s²)

# ============================================
# 优化参数
# ============================================
optimization:
  sampling_points: 100       # 约束检查采样点数（越多越精确但越慢）
  
# ============================================
# 可视化参数
# ============================================
visualization:
  sampling_rate: 100.0       # CSV导出采样率 (Hz)
  trajectory_file: "trajectory.csv"
  waypoints_file: "waypoints.csv"

# ============================================
# 性能预设（复制到上面的performance部分使用）
# ============================================
# 
# 【极限性能模式】- 最快速度，可能接近约束边界
# time_safety_factor: 1.01
# velocity_utilization: 0.98
# waypoint_velocity_ratio: 0.95
# min_segment_time: 0.3
#
# 【高性能模式】- 推荐用于竞赛（当前配置）
# time_safety_factor: 1.02
# velocity_utilization: 0.95
# waypoint_velocity_ratio: 0.90
# min_segment_time: 0.3
#
# 【平衡模式】- 速度与稳定性平衡
# time_safety_factor: 1.05
# velocity_utilization: 0.85
# waypoint_velocity_ratio: 0.85
# min_segment_time: 0.5
#
# 【保守模式】- 安全第一
# time_safety_factor: 1.2
# velocity_utilization: 0.70
# waypoint_velocity_ratio: 0.70
# min_segment_time: 1.0
#
# ============================================
