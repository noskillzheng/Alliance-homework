# 可视化参数配置
visualizer:
  # 轨迹设置
  trajectory:
    max_length: 50                       # 保留的最大轨迹点数
  
  # 输出平滑（仅影响显示）
  smooth:
    enabled: true
    ema_alpha: 0.35                      # EMA平滑系数（0-1）
  
  # 深度运动检测（接近/远离）
  depth:
    enabled: true
    hysteresis:
      in: 0.06                           # 接近滞回阈值
      out: 0.03                          # 远离滞回阈值
    hold_time: 0.2                       # 状态切换保持时间（秒）

