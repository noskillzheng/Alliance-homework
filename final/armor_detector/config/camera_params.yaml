# 相机参数配置
camera:
  # 曝光参数
  exposure_time: 6000      # 曝光时间（微秒）
  gain: 10.1               # 增益值
  gamma: 0.7               # 伽马值
  
  # 分辨率
  resolution:
    width: 640             # 像素
    height: 480            # 像素

# 备用方案（无海康相机时）
fallback:
  use_video: true
  video_source: "0"        # 0=默认摄像头，或视频文件路径

