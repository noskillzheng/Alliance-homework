# 卡尔曼滤波器参数配置
kalman:
  # 基本设置
  use_enhanced_2d_filter: true           # 跟踪位置+尺寸
  dt: 0.033                              # 默认时间步长（秒）
  prediction_time: 0.5                   # 预测时间（秒）
  use_variable_dt: true                  # 使用实测帧间隔
  use_log_scale: true                    # 尺寸使用log域（更稳定）
  
  # 过程噪声（Q矩阵，8维）
  process_noise:
    x: 0.5                               # 位置噪声
    y: 0.5
    vx: 2.0                              # 速度噪声
    vy: 2.0
    w: 5.0                               # 尺寸噪声
    h: 5.0
    vw: 10.0                             # 尺寸速度噪声
    vh: 10.0
  
  # 测量噪声（R矩阵，4维）
  measurement_noise:
    x: 3.0                               # 位置测量噪声
    y: 3.0
    w: 5.0                               # 尺寸测量噪声
    h: 5.0
  
  # 自适应参数
  adaptive:
    enabled: true
    fading_factor: 1.05                  # 渐消因子（1.0-1.2）
    k_innovation_low: 2.0                # 创新量小阈值
    k_innovation_high: 8.0               # 创新量大阈值
    r_scale_low: 0.7                     # R缩小系数
    r_scale_high: 1.4                    # R放大系数
  
  # 丢失处理
  max_lost_frames: 15                    # 最大丢失帧数（超过则重置滤波器）

